[project]
name = "local-notes"
version = "0.2.0"
description = "macOS menu-bar app that records, transcribes (Parakeet / Whisper / Granite via MLX), and summarizes audio locally on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.30.0",
    # Upper-bounded: the chunked final pass uses parakeet_mlx.alignment /
    # parakeet_mlx.audio helpers that are outside the package's public __all__.
    "parakeet-mlx>=0.5.2,<0.6",
    "mlx-whisper>=0.4.3,<0.5",
    "mlx-lm>=0.31,<0.32",
    # Imported by parakeet_mlx.audio for the mel filterbank.
    "librosa>=0.10.0",
    "torch>=2.3.0",
    "transformers>=4.52.4",
    # Not imported directly, but all three are load-bearing for Granite:
    # transformers loads its LoRA adapter through peft, its tokenizer needs
    # sentencepiece, and GraniteSpeechFeatureExtractor calls
    # requires_backends(self, ["torchaudio"]) to build its mel filterbank.
    "torchaudio>=2.3.0",
    "peft>=0.15.0",
    "sentencepiece>=0.2.0",
    # soundfile is intentionally absent: librosa (via parakeet-mlx) requires it,
    # so it is always installed, and nothing here imports it directly.
]

[project.scripts]
local-notes = "app.main:main"

[project.urls]
Homepage = "https://github.com/PatrickJaiin/local-notes-taker"
Issues = "https://github.com/PatrickJaiin/local-notes-taker/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
