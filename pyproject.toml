[project]
name = "local-notes"
version = "0.2.0"
description = "macOS menu-bar app that records, transcribes (Parakeet / Whisper / Granite via MLX), and summarizes audio locally on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.30.0",
    "parakeet-mlx>=0.3.0",
    "mlx-whisper>=0.4.0",
    "mlx-lm>=0.21.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "transformers>=4.52.4",
    "peft>=0.15.0",
    "soundfile>=0.12.1",
    "sentencepiece>=0.2.0",
]

[project.scripts]
local-notes = "app.main:main"

[project.urls]
Homepage = "https://github.com/PatrickJaiin/local-notes-taker"
Issues = "https://github.com/PatrickJaiin/local-notes-taker/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
